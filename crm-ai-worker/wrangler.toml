name = "crm-ai-worker"
main = "src/index.ts"
compatibility_date = "2024-03-01"

# Workers AI binding: free-tier Neurons power the zero-cost relevance precheck
# that runs BEFORE the paid Gemini analysis (skips clearly irrelevant companies).
[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "crm-ai-db"
# Stage 5: the real D1 database id no longer lives in the repo. CI substitutes
# this placeholder from the CLOUDFLARE_D1_DATABASE_ID secret before deploying
# (see .github/workflows/deploy-worker.yml, "Configure D1 database ID"). Local
# dev: `npx wrangler d1 list` then paste your id here (never commit it).
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# GEMINI_API_KEY must be stored as a Wrangler secret:
# npx wrangler secret put GEMINI_API_KEY
# Optional secret/configuration:
# npx wrangler secret put GEMINI_MODEL

# §32 smoke-test flag (optional, default off). "true"/"1" makes every send a
# no-op that still walks the full state machine — no Gmail call, no quota.
# Set it for production smoke tests, then REMOVE it. See docs/deployment-v2.md.
# [vars]
# OUTREACH_DRY_RUN = "true"
