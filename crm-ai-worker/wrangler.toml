name = "crm-ai-worker"
main = "src/index.ts"
compatibility_date = "2024-03-01"

# Workers AI binding: free-tier Neurons power the zero-cost relevance precheck
# that runs BEFORE the paid Gemini analysis (skips clearly irrelevant companies).
[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "crm-ai-db"
# Stage 5: the real D1 database id no longer lives in the repo. CI substitutes
# this placeholder from the CLOUDFLARE_D1_DATABASE_ID secret before deploying
# (see .github/workflows/deploy-worker.yml, "Configure D1 database ID"). Local
# dev: `npx wrangler d1 list` then paste your id here (never commit it).
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# GEMINI_API_KEY must be stored as a Wrangler secret:
# npx wrangler secret put GEMINI_API_KEY
# Optional secret/configuration:
# npx wrangler secret put GEMINI_MODEL

# §32 smoke-test flag (optional, default off). "true"/"1" makes every send a
# no-op that still walks the full state machine — no Gmail call, no quota.
# Set it for production smoke tests, then REMOVE it. See docs/deployment-v2.md.
# [vars]
# OUTREACH_DRY_RUN = "true"

# Post-V2 (audit retention): days an audit_logs row survives. The cron tick
# (every 5 min) prunes older rows and writes an AUDIT_PRUNE audit row.
# Unset → default 180 days; "0" disables pruning entirely.
# [vars]
# AUDIT_RETENTION_DAYS = "180"

# Post-V2 Stage 31 (data retention): horizon for gmail_send_log /
# research_runs / superseded evidence history / customer_imports (the raw
# import layer — normalized customers always survive). Evidence is pruned
# superseded-only, so the live chain of every field survives forever.
# Unset → default 180 days; "0" disables business-data pruning (the fixed
# 30-day admin_login_attempts sweep always runs). Non-empty prunes write a
# DATA_PRUNE audit row with per-table counts.
# DATA_RETENTION_DAYS = "180"

# Post-V2 Stage 29 (WebAuthn 2FA). All three optional; while WEBAUTHN_RP_ID
# is unset the feature sleeps: login stays single-factor (token → session),
# register endpoints answer 503, and existing credential rows are ignored.
# Once set AND the bootstrap operator has registered a security key/passkey:
#   - login becomes two-step (token → assert challenge → session);
#   - the Bearer master-token API path is CLOSED (a second factor that can
#     be skipped by moving the token into an Authorization header would be
#     decoration) — scripts must switch to cookie sessions or remove the
#     last credential to re-open Bearer.
# WEBAUTHN_RP_ID: the domain end-users see, e.g. "crm.example.com" (no
#   scheme, no port). A worker.dev host works for testing.
# WEBAUTHN_RP_NAME: display name (defaults to RP_ID).
# WEBAUTHN_ORIGINS: comma-separated allowlist of caller origins. Defaults to
#   https://<RP_ID>; add extra origins (e.g. a custom domain AND the
#   workers.dev route) as "https://crm.example.com,https://crm.example.workers.dev".
# [vars]
# WEBAUTHN_RP_ID = "crm.example.com"
# WEBAUTHN_RP_NAME = "CRM Admin"
# WEBAUTHN_ORIGINS = "https://crm.example.com"

# Post-V2 Stage 32: Durable-Object-backed sliding-window rate limiter.
# With this binding the provider RPM cap becomes a TRUE global sliding
# window (the Stage 16 D1 fixed window could admit up to 2x the cap across
# a window boundary). The DO keeps its window in memory only: eviction
# resets it, which is the same fail-open policy as every limiter tier —
# the reactive 429 + api_key_health cooldown stays the safety net. If the
# binding is absent the D1 fixed window remains authoritative, so nothing
# breaks locally or in tests.
[durable_objects]
bindings = [{ name = "RATE_LIMITER", class_name = "RateLimiterDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]
