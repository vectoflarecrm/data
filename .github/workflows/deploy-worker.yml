      EXA_API_KEY_57: ${{ secrets.EXA_API_KEY_57 }}
      EXA_API_KEY_58: ${{ secrets.EXA_API_KEY_58 }}
      EXA_API_KEY_59: ${{ secrets.EXA_API_KEY_59 }}
      EXA_API_KEY_60: ${{ secrets.EXA_API_KEY_60 }}
      GMAIL_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GMAIL_SERVICE_ACCOUNT_EMAIL }}
      GMAIL_SERVICE_ACCOUNT_KEY: ${{ secrets.GMAIL_SERVICE_ACCOUNT_KEY }}
      GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
      GMAIL_DAILY_LIMIT: ${{ secrets.GMAIL_DAILY_LIMIT }}
      GMAIL_SEND_DELAY_MS: ${{ secrets.GMAIL_SEND_DELAY_MS }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_PANEL_TOKEN: ${{ secrets.ADMIN_PANEL_TOKEN }}
      # Secret sync from GitHub is now OPT-IN: keys are managed in the admin
      # panel (/admin/keys, D1 dynamic key pool) or via wrangler/CI. Set this
      # repo secret to 'true' only if you want CI to force-sync keys from GitHub.

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GitHub Secret: GEMINI_API_KEY"; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure D1 database exists
        env:
          D1_NAME: crm-ai-db
        run: |
          set -euo pipefail
          d1_id="${CLOUDFLARE_D1_DATABASE_ID:-}"
          if [ -z "$d1_id" ]; then
            set +e
            d1_json="$(npx wrangler d1 list --json 2>/tmp/d1-list-error)"
            list_status=$?
            set -e
            if [ "$list_status" -eq 0 ]; then
              d1_id="$(D1_JSON="$d1_json" D1_NAME="$D1_NAME" node - <<'NODE'
          const raw = JSON.parse(process.env.D1_JSON || '[]');
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const row = rows.find((item) => item.name === process.env.D1_NAME);
          process.stdout.write((row && (row.uuid || row.database_id || row.databaseId || row.id)) || '');
          NODE
              )"
            fi
          fi
          if [ -z "$d1_id" ]; then
            echo "D1 database $D1_NAME was not found; creating it now"
            create_output="$(npx wrangler d1 create "$D1_NAME" --binding DB 2>/tmp/d1-create-error)" || {
              echo "Unable to create D1 database $D1_NAME"
              sed -n '1,20p' /tmp/d1-create-error
              exit 1
            }
            d1_id="$(printf '%s\n' "$create_output" | sed -nE 's/.*database_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -1)"
          fi
          if ! printf '%s' "$d1_id" | grep -Eq '^[0-9a-fA-F-]{16,}$'; then
            echo "Could not resolve a valid D1 database ID for $D1_NAME"
            exit 1
          fi
          echo "D1_ID=$d1_id" >> "$GITHUB_ENV"
          echo "::add-mask::$d1_id"

      - name: Configure D1 database ID
        run: |
          D1_ID="$D1_ID" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler.toml")
          text = path.read_text()
          placeholder = 'database_id = "REPLACE_WITH_D1_DATABASE_ID"'
          # Stage 5: the repo keeps only the placeholder. Failing hard here
          # prevents a real database id from quietly re-entering the repo.
          if placeholder not in text:
              raise SystemExit('wrangler.toml is missing database_id = "REPLACE_WITH_D1_DATABASE_ID" - real D1 ids must not be committed (security-v2 stage 5)')
          path.write_text(text.replace(placeholder, f'database_id = "{os.environ["D1_ID"]}"'))
          PY

      - name: Initialize remote D1 schema
        # Fast path: schema.sql as one atomic D1 transaction (the 0019-proven
        # --file semantics). Fallback path (first deploy against a pre-V2
        # database): per-statement execution tolerating ONLY "no such column"
        # — the four index statements referencing post-migration columns
        # (idx_outreach_idempotency / idx_outreach_send_lock /
        # idx_outreach_contact / idx_campaign_members_grain) cannot exist
        # until the ALTER steps below add their columns; they land on the
        # next deploy, which takes the fast path again (verified by the
        # deploy-sequence probe: standard + legacy-no-FK both converge, the
        # second deploy runs 0 tolerated). Any other SQL error still fails
        # the deploy.
        run: |
          if npx wrangler d1 execute crm-ai-db --remote --file=./schema.sql; then
            echo 'schema.sql applied atomically'
          else
            echo 'atomic schema.sql failed - per-statement fallback (pre-V2 first deploy)'
            python3 - <<'PY'
          import re, subprocess, sys
          sql = open('schema.sql', encoding='utf-8').read()
          body = '\n'.join(l for l in sql.split('\n') if not l.lstrip().startswith('--'))
          stmts = [s.strip() for s in re.split(r';\s*\n', body) if s.strip()]
          tolerated, failed = 0, []
          for s in stmts:
              p = subprocess.run(
                  ['npx', 'wrangler', 'd1', 'execute', 'crm-ai-db', '--remote', '--command', s],
                  capture_output=True, text=True)
              if p.returncode == 0:
                  continue
              out = p.stdout + p.stderr
              if 'no such column' in out:
                  tolerated += 1
                  print(f'TOLERATED (lands after the ALTER steps): {s.splitlines()[0][:100]}')
              else:
                  failed.append((s.splitlines()[0], out))
          if failed:
              for head, out in failed:
                  print(f'FAILED: {head}')
                  print(out)
              sys.exit(1)
          print(f'schema fallback complete: {len(stmts)} statements, {tolerated} tolerated, 0 unexpected failures')
          PY
          fi

      - name: Verify remote D1 schema
        run: |
          schema_output="$(npx wrangler d1 execute crm-ai-db --remote --command='SELECT name FROM sqlite_master WHERE type = "table" AND name = "customers";')"
          printf '%s\n' "$schema_output"
          printf '%s' "$schema_output" | grep -q 'customers' || {
            echo "Remote D1 schema check failed: customers table is missing"
            exit 1
          }

      - name: Migrate customers profile columns
        # ADD COLUMN is not idempotent in D1 files (a duplicate column fails
        # the whole batch), so migrations run per-statement and ignore the
        # "already exists" error — every later run becomes a no-op.
        run: |
          for col in company_profile TEXT outreach_context TEXT lead_score INTEGER buying_signals TEXT source_import_id TEXT; do
            set -- $col
            npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE customers ADD COLUMN $1 $2" 2>&1 | grep -q 'duplicate column name' && echo "$1 already exists" || true
          done
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('customers') WHERE name IN ('company_profile','outreach_context','lead_score','buying_signals','source_import_id')")"
          echo "$info" | grep -q '"n": 5' || { echo 'Migration failed: enrichment columns missing'; exit 1; }

      - name: Migrate api_configs credential columns
        # key_hint / key_fingerprint support encrypted key storage. They live
        # in schema.sql's CREATE TABLE too, but an existing database needs the
        # ALTER, and D1 fails a whole schema file on a duplicate ALTER — hence
        # per-statement with duplicate-column tolerance, same as above.
        run: |
          for col in key_hint TEXT key_fingerprint TEXT; do
            set -- $col
            npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE api_configs ADD COLUMN $1 $2" 2>&1 | grep -q 'duplicate column name' && echo "$1 already exists" || true
          done
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('api_configs') WHERE name IN ('key_hint','key_fingerprint')")"
          echo "$info" | grep -q '"n": 2' || { echo 'Migration failed: api_configs credential columns missing'; exit 1; }

      - name: Migrate outreach_emails send-state columns (Security V2 Stage 10)
        # Gmail sending state machine (spec §11): idempotency key, attempt
        # counter, lock fields, last_error, gmail_message_id. Same per-statement
        # ALTER pattern as above; the indexes are IF NOT EXISTS so schema.sql
        # and this step agree on both fresh and existing databases.
        run: |
          for col in idempotency_key:TEXT send_attempts:"INTEGER NOT NULL DEFAULT 0" locked_at:TEXT locked_by:TEXT last_error:TEXT gmail_message_id:TEXT; do
            name="${col%%:*}"
            def="${col#*:}"
            npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE outreach_emails ADD COLUMN $name $def" 2>&1 | grep -q 'duplicate column name' && echo "$name already exists" || true
          done
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_outreach_idempotency ON outreach_emails(idempotency_key) WHERE idempotency_key IS NOT NULL" || true
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE INDEX IF NOT EXISTS idx_outreach_send_lock ON outreach_emails(status, locked_at)" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('outreach_emails') WHERE name IN ('idempotency_key','send_attempts','locked_at','locked_by','last_error','gmail_message_id')")"
          echo "$info" | grep -q '"n": 6' || { echo 'Migration failed: outreach_emails send-state columns missing'; exit 1; }

      - name: Migrate gmail_send_log sender column (Security V2 Stage 23)
        # sender_client_email (per-account daily quota counting, gmail-quota.ts)
        # lived only in migrations/0003 — a fresh schema.sql install lacked it
        # and reserveQuota failed closed. schema.sql's CREATE now has it; this
        # per-statement ALTER with duplicate-column tolerance self-heals any
        # database created from the old schema.sql, same pattern as above.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE gmail_send_log ADD COLUMN sender_client_email TEXT" 2>&1 | grep -q 'duplicate column name' && echo "sender_client_email already exists" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('gmail_send_log') WHERE name = 'sender_client_email'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: gmail_send_log sender column missing'; exit 1; }

      - name: Migrate research runs + evidence provenance (Security V2 Stage 14)
        # Evidence V2 (spec §15): research_runs (new table, created by
        # schema.sql via IF NOT EXISTS — the CREATE here is belt-and-suspenders)
        # plus append-only evidence columns. Existing rows become is_current = 1
        # via the ALTER's NOT NULL DEFAULT — they were the current facts at
        # migration time. Same per-statement ALTER pattern as above.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE TABLE IF NOT EXISTS research_runs (id TEXT PRIMARY KEY, customer_id TEXT NOT NULL, status TEXT NOT NULL, started_at TEXT NOT NULL, completed_at TEXT, parser_version TEXT, model_name TEXT, model_version TEXT, error TEXT)" || true
          for col in research_run_id:TEXT source_id:TEXT source_hash:TEXT content_hash:TEXT parser_version:TEXT model_name:TEXT model_version:TEXT retrieved_at:TEXT "is_current:INTEGER NOT NULL DEFAULT 1" valid_from:TEXT valid_until:TEXT; do
            name="${col%%:*}"
            def="${col#*:}"
            npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE evidence ADD COLUMN $name $def" 2>&1 | grep -q 'duplicate column name' && echo "$name already exists" || true
          done
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('evidence') WHERE name IN ('research_run_id','source_id','source_hash','content_hash','parser_version','model_name','model_version','retrieved_at','is_current','valid_from','valid_until')")"
          echo "$info" | grep -q '"n": 11' || { echo 'Migration failed: evidence provenance columns missing'; exit 1; }
          info2="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'table' AND name = 'research_runs'")"
          echo "$info2" | grep -q '"n": 1' || { echo 'Migration failed: research_runs table missing'; exit 1; }

      - name: Migrate customers completeness column (Security V2 Stage 15)
        # Spec §16: data_completeness_score is a quality axis SEPARATE from
        # lead_score (fit vs. how well we know the record). Same per-statement
        # ALTER pattern; no backfill — NULL means "not yet scored".
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE customers ADD COLUMN data_completeness_score INTEGER" 2>&1 | grep -q 'duplicate column name' && echo "data_completeness_score already exists" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('customers') WHERE name = 'data_completeness_score'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: data_completeness_score missing'; exit 1; }

      - name: Migrate contacts + integrity indexes (Security V2 Stage 17)
        # Spec §18: the contacts table was read/written by the code but only
        # ever created manually in production — the CREATE here (plus
        # schema.sql) fixes fresh installs and pins the production shape.
        # The §18.1 UNIQUE indexes are created with || true tolerance (Stage
        # 10 idempotency-index precedent): if a live table already holds
        # duplicates the creation is skipped with a warning instead of
        # blocking the deploy — the verification query below reports which
        # indexes exist so a skipped one is visible in the CI log.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE TABLE IF NOT EXISTS contacts (id INTEGER PRIMARY KEY, contact_id TEXT NOT NULL, company_id TEXT NOT NULL, seq INTEGER NOT NULL, first_name TEXT, last_name TEXT, full_name TEXT, title TEXT, department TEXT, email TEXT, cellphone TEXT, tel TEXT, whatsapp TEXT, linkedin_url TEXT, social_accounts TEXT)" || true
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE customers ADD COLUMN display_id TEXT" 2>&1 | grep -q 'duplicate column name' && echo "display_id already exists" || true
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_customers_domain ON customers(domain) WHERE domain != ''" || echo "WARNING: idx_customers_domain skipped (duplicate domains exist — clean them and re-run)"
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_api_configs_fingerprint ON api_configs(provider, key_fingerprint) WHERE key_fingerprint IS NOT NULL" || echo "WARNING: idx_api_configs_fingerprint skipped (duplicate fingerprints exist — clean them and re-run)"
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_contacts_contact_id ON contacts(contact_id)" || echo "WARNING: idx_contacts_contact_id skipped (duplicate contact_id values exist)"
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_contacts_seq ON contacts(company_id, seq)" || echo "WARNING: idx_contacts_seq skipped (duplicate (company_id, seq) pairs exist)"
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'table' AND name = 'contacts'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: contacts table missing'; exit 1; }
          indexes="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'index' AND name IN ('idx_customers_domain','idx_api_configs_fingerprint','idx_contacts_contact_id','idx_contacts_seq','idx_contacts_company','idx_research_runs_customer')")"
          echo "integrity indexes present: $indexes"

      - name: Migrate business request_id columns (post-V2 Stage 33)
        # Traceability chain: outreach_emails / gmail_send_log /
        # customer_imports each gain a request_id column holding the admin
        # request's UUID (X-Request-ID, same id as that request's audit
        # rows). Additive nullable columns — old code ignores them.
        # Per-statement ALTER with duplicate-column tolerance, then verify.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE outreach_emails ADD COLUMN request_id TEXT" 2>&1 | grep -q 'duplicate column name' && echo "outreach_emails.request_id already exists" || true
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE gmail_send_log ADD COLUMN request_id TEXT" 2>&1 | grep -q 'duplicate column name' && echo "gmail_send_log.request_id already exists" || true
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE customer_imports ADD COLUMN request_id TEXT" 2>&1 | grep -q 'duplicate column name' && echo "customer_imports.request_id already exists" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('outreach_emails') WHERE name = 'request_id'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: outreach_emails.request_id missing'; exit 1; }
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('gmail_send_log') WHERE name = 'request_id'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: gmail_send_log.request_id missing'; exit 1; }
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('customer_imports') WHERE name = 'request_id'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: customer_imports.request_id missing'; exit 1; }

      - name: Rebuild outreach_emails with FK (post-V2 Stage 34)
        # Schema drift fix: fresh installs always had the FOREIGN KEY
        # (customer_id) REFERENCES customers(id) declaration (schema.sql)
        # and D1 enforces FKs by default in every transaction — only legacy
        # databases still run a pre-FK outreach_emails shape. SQLite cannot
        # ALTER a table to add a FOREIGN KEY, so this is a single-transaction
        # table rebuild (wrangler --file runs the whole file as one implicit
        # transaction; any statement failing rolls the entire file back).
        # Skipped entirely when the FK is already present (idempotent and
        # rows_written-quota friendly). Orphaned drafts would make the
        # INSERT SELECT fail the rebuilt FK — checked first, and a failure
        # names the cleanup SQL instead of silently dropping data.
        run: |
          fk="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_foreign_key_list('outreach_emails')")"
          if echo "$fk" | grep -q '"n": 0'; then
            orphans="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM outreach_emails e LEFT JOIN customers c ON c.id = e.customer_id WHERE e.customer_id IS NOT NULL AND c.id IS NULL")"
            if echo "$orphans" | grep -q '"n": 0'; then
              before_n="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM outreach_emails" | grep -o '"n": [0-9]*')"
              echo 'outreach_emails FK missing and no orphans - rebuilding table (single transaction)'
              npx wrangler d1 execute crm-ai-db --remote --file=./migrations/0019_outreach_emails_fk_rebuild.sql
              after_n="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM outreach_emails" | grep -o '"n": [0-9]*')"
              [ "$before_n" = "$after_n" ] || { echo "Migration failed: outreach_emails row count changed ($before_n -> $after_n)"; exit 1; }
            else
              echo "Migration blocked: orphaned outreach_emails rows exist ($orphans). Clean them up first, e.g.:"
              echo '  DELETE FROM outreach_emails WHERE customer_id IS NOT NULL AND customer_id NOT IN (SELECT id FROM customers);'
              exit 1
            fi
          else
            echo 'outreach_emails FK already present - skipping rebuild'
          fi
          fk="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_foreign_key_list('outreach_emails')")"
          echo "$fk" | grep -q '"n": 1' || { echo 'Migration failed: outreach_emails FK missing after rebuild'; exit 1; }

      - name: Backfill research_sources from full_research_text (Phase 3 Stage 36)
        # Legacy raw snapshots (one overwrite-prone blob per customer) join
        # the append-only research_sources history as synthetic 'backfill'
        # runs. The SQL is idempotent (deterministic run ids + NOT EXISTS
        # guards — re-deploys insert nothing) and atomic (--file = one
        # implicit transaction). Runs AFTER schema.sql (table exists) and
        # BEFORE the new worker deploys (no live writer can race it on the
        # first pass). Sanity-checked afterwards; a failed step must block
        # the deploy, never pass silently.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --file=./migrations/0021_research_sources_backfill.sql
          n_sources="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM research_sources s JOIN research_runs r ON r.id = s.research_run_id WHERE s.parser_version = 'backfill-v1'" | grep -o '"n": [0-9]*' | grep -o '[0-9]*')"
          n_runs="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM research_runs WHERE parser_version = 'backfill-v1'" | grep -o '"n": [0-9]*' | grep -o '[0-9]*')"
          echo "backfill complete: $n_sources source rows for $n_runs synthetic runs"
          [ "$n_sources" = "$n_runs" ] || { echo "Migration failed: backfill runs without matching source rows ($n_runs runs vs $n_sources sources)"; exit 1; }

      - name: Migrate research_facts contact_id (Phase 4 Stage 42)
        # Light entity resolution (phase4 §4.4): a nullable column needs no
        # table rebuild, so existing databases take a single ALTER —
        # duplicate-column tolerant like every Stage 17+ ALTER (re-deploys
        # must stay green). Fresh installs already have the column from the
        # schema.sql step above; the pragma check verifies convergence.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE research_facts ADD COLUMN contact_id TEXT" 2>&1 | grep -q 'duplicate column name' && echo "research_facts.contact_id already exists" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('research_facts') WHERE name = 'contact_id'")"
          echo "research_facts contact_id columns: $info"
          echo "$info" | grep -q '"n": 1' || { echo "Migration failed: research_facts.contact_id missing after ALTER"; exit 1; }

      - name: Migrate customers lead_score_breakdown (Phase 5 Stage 43)
        # Lead Score V2 (建议 §十八, phase5 §4.1): the six-dimension
        # decomposition is cached beside the total. A nullable column needs
        # no table rebuild — single ALTER, duplicate-column tolerant like
        # every Stage 17+ ALTER. Fresh installs already have the column
        # from the schema.sql step above; the pragma check verifies
        # convergence. Runs BEFORE the new worker version deploys, the same
        # guarantee Stage 15 relied on for data_completeness_score.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE customers ADD COLUMN lead_score_breakdown TEXT" 2>&1 | grep -q 'duplicate column name' && echo "customers.lead_score_breakdown already exists" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('customers') WHERE name = 'lead_score_breakdown'")"
          echo "customers lead_score_breakdown columns: $info"
          echo "$info" | grep -q '"n": 1' || { echo "Migration failed: customers.lead_score_breakdown missing after ALTER"; exit 1; }

      - name: Migrate outreach contact-grain columns (Phase 8 Stage 49)
        # 0027: outreach_emails.contact_id (per-person drafts) and
        # outreach_campaign_members.contact_id (per-person snapshots) plus
        # the (brand, customer, contact) dedup index. Nullable additive
        # columns, same duplicate-column-tolerant ALTER pattern as every
        # Stage 17+ step. Runs AFTER the Stage 34 FK rebuild on purpose:
        # 0019's frozen column list predates Phase 8, so this step adds
        # contact_id to whatever shape the rebuild produced (or the
        # pre-existing table, when the rebuild was skipped).
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE outreach_emails ADD COLUMN contact_id INTEGER" 2>&1 | grep -q 'duplicate column name' && echo "outreach_emails.contact_id already exists" || true
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE outreach_campaign_members ADD COLUMN contact_id INTEGER" 2>&1 | grep -q 'duplicate column name' && echo "outreach_campaign_members.contact_id already exists" || true
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE INDEX IF NOT EXISTS idx_outreach_contact ON outreach_emails(brand_name, customer_id, contact_id)" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('outreach_emails') WHERE name = 'contact_id'")"
          echo "$info" | grep -q '"n": 1' || { echo "Migration failed: outreach_emails.contact_id missing"; exit 1; }
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('outreach_campaign_members') WHERE name = 'contact_id'")"
          echo "$info" | grep -q '"n": 1' || { echo "Migration failed: outreach_campaign_members.contact_id missing"; exit 1; }

      - name: Rebuild outreach_campaign_members grain (Phase 9 Stage 53)
        # 0028: the (campaign_id, customer_id) PRIMARY KEY cannot hold
        # multi-contact rows, so the rebuilt table has no explicit PK and
        # the grain guarantee moves to contact_norm (STORED generated
        # COALESCE(contact_id, 0)) under a UNIQUE index — the 0019
        # single-transaction rebuild precedent. Gated on the grain INDEX,
        # not pragma_table_info (SQLite hides STORED generated columns
        # there — probe-verified), so an already-rebuilt database skips
        # the data movement entirely; the pre-rebuild PK shape cannot hold
        # grain duplicates, so the INSERT SELECT cannot violate the new
        # index.
        run: |
          grain="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'index' AND name = 'idx_campaign_members_grain'")"
          if echo "$grain" | grep -q '"n": 0'; then
            before_n="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM outreach_campaign_members" | grep -o '"n": [0-9]*')"
            echo 'campaign_members grain rebuild required - running migration 0028 (single transaction)'
            npx wrangler d1 execute crm-ai-db --remote --file=./migrations/0028_campaign_members_grain.sql
            after_n="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM outreach_campaign_members" | grep -o '"n": [0-9]*')"
            [ "$before_n" = "$after_n" ] || { echo "Migration failed: campaign_members row count changed ($before_n -> $after_n)"; exit 1; }
          else
            echo 'campaign_members grain already rebuilt - skipping'
          fi
          grain="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'index' AND name = 'idx_campaign_members_grain'")"
          echo "$grain" | grep -q '"n": 1' || { echo "Migration failed: idx_campaign_members_grain missing after rebuild"; exit 1; }
          norm="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_xinfo('outreach_campaign_members') WHERE name = 'contact_norm'")"
          echo "$norm" | grep -q '"n": 1' || { echo "Migration failed: contact_norm missing after rebuild"; exit 1; }

      - name: Migrate outreach_campaigns auto_advance (campaign auto-advance)
        # 开发信自动推进: additive NOT NULL DEFAULT 0 column — old rows read as
        # "not opted in", so behavior is unchanged until an operator toggles the
