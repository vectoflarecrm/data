            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync NVIDIA NIM keys
          for var_name in NVIDIA_API_KEY NVIDIA_API_KEY_2 NVIDIA_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
