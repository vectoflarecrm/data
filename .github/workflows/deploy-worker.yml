name: Deploy CRM AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "crm-ai-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-crm-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, typecheck and deploy Worker
    # Pinned rather than ubuntu-latest: the label starts migrating to Ubuntu 26
    # on 2026-10-19, and a runner image bump is not something this Worker needs
    # to take risks on to resolve an unrelated warning.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crm-ai-worker
    env:
