name: Deploy CRM AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "crm-ai-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Typecheck and deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GitHub Secret: GEMINI_API_KEY"; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure D1 database exists
        env:
          D1_NAME: crm-ai-db
        run: |
          set -euo pipefail
          d1_id="${CLOUDFLARE_D1_DATABASE_ID:-}"
          if [ -z "$d1_id" ]; then
            set +e
            d1_json="$(npx wrangler d1 list --json 2>/tmp/d1-list-error)"
            list_status=$?
            set -e
            if [ "$list_status" -eq 0 ]; then
              d1_id="$(D1_JSON="$d1_json" D1_NAME="$D1_NAME" node - <<'NODE'
          const raw = JSON.parse(process.env.D1_JSON || '[]');
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const row = rows.find((item) => item.name === process.env.D1_NAME);
          process.stdout.write((row && (row.uuid || row.database_id || row.databaseId || row.id)) || '');
          NODE
              )"
            fi
          fi
          if [ -z "$d1_id" ]; then
            echo "D1 database $D1_NAME was not found; creating it now"
            create_json="$(npx wrangler d1 create "$D1_NAME" --json 2>/tmp/d1-create-error)" || {
              echo "Unable to create D1 database $D1_NAME"
              sed -n '1,20p' /tmp/d1-create-error
              exit 1
            }
            d1_id="$(D1_JSON="$create_json" node - <<'NODE'
          const raw = JSON.parse(process.env.D1_JSON || '{}');
          const findId = (value) => {
            if (!value || typeof value !== 'object') return '';
            if (typeof value.uuid === 'string') return value.uuid;
            if (typeof value.database_id === 'string') return value.database_id;
            if (typeof value.databaseId === 'string') return value.databaseId;
            if (typeof value.id === 'string') return value.id;
            for (const child of Object.values(value)) {
              const found = findId(child);
              if (found) return found;
            }
            return '';
          };
          process.stdout.write(findId(raw));
          NODE
            )"
          fi
          if ! printf '%s' "$d1_id" | grep -Eq '^[0-9a-fA-F-]{16,}$'; then
            echo "Could not resolve a valid D1 database ID for $D1_NAME"
            exit 1
          fi
          echo "D1_ID=$d1_id" >> "$GITHUB_ENV"
          echo "::add-mask::$d1_id"

      - name: Configure D1 database ID
        run: |
          D1_ID="$D1_ID" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler.toml")
          text = path.read_text()
          placeholder = 'database_id = "REPLACE_WITH_D1_DATABASE_ID"'
          if placeholder in text:
              path.write_text(text.replace(placeholder, f'database_id = "{os.environ["D1_ID"]}"'))
          PY

      - name: Initialize remote D1 schema
        run: npx wrangler d1 execute crm-ai-db --remote --file=./schema.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync Gemini Worker Secret
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          if [ -n "$GEMINI_MODEL" ]; then
            printf '%s' "$GEMINI_MODEL" | npx wrangler secret put GEMINI_MODEL
          fi
