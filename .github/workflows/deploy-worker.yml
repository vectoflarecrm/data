      EXA_API_KEY_51: ${{ secrets.EXA_API_KEY_51 }}
      EXA_API_KEY_52: ${{ secrets.EXA_API_KEY_52 }}
      EXA_API_KEY_53: ${{ secrets.EXA_API_KEY_53 }}
      EXA_API_KEY_54: ${{ secrets.EXA_API_KEY_54 }}
      EXA_API_KEY_55: ${{ secrets.EXA_API_KEY_55 }}
      EXA_API_KEY_56: ${{ secrets.EXA_API_KEY_56 }}
      EXA_API_KEY_57: ${{ secrets.EXA_API_KEY_57 }}
      EXA_API_KEY_58: ${{ secrets.EXA_API_KEY_58 }}
      EXA_API_KEY_59: ${{ secrets.EXA_API_KEY_59 }}
      EXA_API_KEY_60: ${{ secrets.EXA_API_KEY_60 }}
      GMAIL_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GMAIL_SERVICE_ACCOUNT_EMAIL }}
      GMAIL_SERVICE_ACCOUNT_KEY: ${{ secrets.GMAIL_SERVICE_ACCOUNT_KEY }}
      GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
      GMAIL_DAILY_LIMIT: ${{ secrets.GMAIL_DAILY_LIMIT }}
      GMAIL_SEND_DELAY_MS: ${{ secrets.GMAIL_SEND_DELAY_MS }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_PANEL_TOKEN: ${{ secrets.ADMIN_PANEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GitHub Secret: GEMINI_API_KEY"; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure D1 database exists
        env:
          D1_NAME: crm-ai-db
        run: |
          set -euo pipefail
          d1_id="${CLOUDFLARE_D1_DATABASE_ID:-}"
          if [ -z "$d1_id" ]; then
            set +e
            d1_json="$(npx wrangler d1 list --json 2>/tmp/d1-list-error)"
            list_status=$?
            set -e
            if [ "$list_status" -eq 0 ]; then
              d1_id="$(D1_JSON="$d1_json" D1_NAME="$D1_NAME" node - <<'NODE'
          const raw = JSON.parse(process.env.D1_JSON || '[]');
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const row = rows.find((item) => item.name === process.env.D1_NAME);
          process.stdout.write((row && (row.uuid || row.database_id || row.databaseId || row.id)) || '');
          NODE
              )"
            fi
          fi
          if [ -z "$d1_id" ]; then
            echo "D1 database $D1_NAME was not found; creating it now"
            create_output="$(npx wrangler d1 create "$D1_NAME" --binding DB 2>/tmp/d1-create-error)" || {
              echo "Unable to create D1 database $D1_NAME"
              sed -n '1,20p' /tmp/d1-create-error
              exit 1
            }
            d1_id="$(printf '%s\n' "$create_output" | sed -nE 's/.*database_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -1)"
          fi
          if ! printf '%s' "$d1_id" | grep -Eq '^[0-9a-fA-F-]{16,}$'; then
            echo "Could not resolve a valid D1 database ID for $D1_NAME"
            exit 1
          fi
          echo "D1_ID=$d1_id" >> "$GITHUB_ENV"
          echo "::add-mask::$d1_id"

      - name: Configure D1 database ID
        run: |
          D1_ID="$D1_ID" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler.toml")
          text = path.read_text()
          placeholder = 'database_id = "REPLACE_WITH_D1_DATABASE_ID"'
          if placeholder in text:
              path.write_text(text.replace(placeholder, f'database_id = "{os.environ["D1_ID"]}"'))
          PY

      - name: Initialize remote D1 schema
        run: npx wrangler d1 execute crm-ai-db --remote --file=./schema.sql

      - name: Verify remote D1 schema
        run: |
          schema_output="$(npx wrangler d1 execute crm-ai-db --remote --command='SELECT name FROM sqlite_master WHERE type = "table" AND name = "customers";')"
          printf '%s\n' "$schema_output"
          printf '%s' "$schema_output" | grep -q 'customers' || {
            echo "Remote D1 schema check failed: customers table is missing"
            exit 1
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync Worker secrets
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          # Sync extra Gemini keys (up to 40; one fixed key per company task)
          for i in $(seq 2 40); do
            var_name="GEMINI_API_KEY_$i"
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          if [ -n "$GEMINI_MODEL" ]; then
            printf '%s' "$GEMINI_MODEL" | npx wrangler secret put GEMINI_MODEL
          fi
          # Sync Groq keys
          for var_name in GROQ_API_KEY GROQ_API_KEY_2 GROQ_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Mistral keys
          for var_name in MISTRAL_API_KEY MISTRAL_API_KEY_2 MISTRAL_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync DeepSeek keys
          for var_name in DEEPSEEK_API_KEY DEEPSEEK_API_KEY_2 DEEPSEEK_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync OpenRouter keys
          for var_name in OPENROUTER_API_KEY OPENROUTER_API_KEY_2 OPENROUTER_API_KEY_3 OPENROUTER_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Gmail (Google Workspace service account) sending secrets
          for var_name in GMAIL_SERVICE_ACCOUNT_EMAIL GMAIL_SENDER_EMAIL GMAIL_DAILY_LIMIT GMAIL_SEND_DELAY_MS; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Private key contains newlines: sync via stdin file
          if [ -n "$GMAIL_SERVICE_ACCOUNT_KEY" ]; then
            printf '%s' "$GMAIL_SERVICE_ACCOUNT_KEY" | npx wrangler secret put GMAIL_SERVICE_ACCOUNT_KEY
            echo "Synced GMAIL_SERVICE_ACCOUNT_KEY"
          else
            npx wrangler secret delete GMAIL_SERVICE_ACCOUNT_KEY --name crm-ai-worker 2>/dev/null || true
          fi
          if [ -n "$ADMIN_PANEL_TOKEN" ]; then
            printf '%s' "$ADMIN_PANEL_TOKEN" | npx wrangler secret put ADMIN_PANEL_TOKEN
          else
            echo "ADMIN_PANEL_TOKEN is not configured; /admin remains disabled"
            npx wrangler secret delete ADMIN_PANEL_TOKEN --name crm-ai-worker || true
          fi
          # Legacy Google Custom Search secrets are no longer used by the Worker
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY_2 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID_2 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY_3 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID_3 --name crm-ai-worker 2>/dev/null || true
          # Sync Searlo keys
          for var_name in SEARLO_API_KEY SEARLO_API_KEY_2; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Tavily keys (up to 60; one fixed key per company task)
          # Key #1 accepts both TAVILY_API_KEY and TAVILY_API_KEY_1 naming
          for i in $(seq 1 60); do
            if [ "$i" -eq 1 ]; then var_name=TAVILY_API_KEY; else var_name="TAVILY_API_KEY_$i"; fi
            val="${!var_name:-}"
            if [ -z "$val" ] && [ "$i" -eq 1 ]; then val="${TAVILY_API_KEY_1:-}"; fi
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Exa keys (up to 60)
          # Key #1 accepts both EXA_API_KEY and EXA_API_KEY_1 naming
          for i in $(seq 1 60); do
            if [ "$i" -eq 1 ]; then var_name=EXA_API_KEY; else var_name="EXA_API_KEY_$i"; fi
            val="${!var_name:-}"
            if [ -z "$val" ] && [ "$i" -eq 1 ]; then val="${EXA_API_KEY_1:-}"; fi
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
