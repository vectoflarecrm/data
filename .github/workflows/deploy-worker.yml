          done
          # Sync Gmail (Google Workspace service account) sending secrets
          for var_name in GMAIL_SERVICE_ACCOUNT_EMAIL GMAIL_SENDER_EMAIL GMAIL_DAILY_LIMIT GMAIL_SEND_DELAY_MS; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Private key contains newlines: sync via stdin file
          if [ -n "$GMAIL_SERVICE_ACCOUNT_KEY" ]; then
            printf '%s' "$GMAIL_SERVICE_ACCOUNT_KEY" | npx wrangler secret put GMAIL_SERVICE_ACCOUNT_KEY
            echo "Synced GMAIL_SERVICE_ACCOUNT_KEY"
          else
            npx wrangler secret delete GMAIL_SERVICE_ACCOUNT_KEY --name crm-ai-worker 2>/dev/null || true
          fi
          if [ -n "$ADMIN_PANEL_TOKEN" ]; then
            printf '%s' "$ADMIN_PANEL_TOKEN" | npx wrangler secret put ADMIN_PANEL_TOKEN
          else
            echo "ADMIN_PANEL_TOKEN is not configured; /admin remains disabled"
            npx wrangler secret delete ADMIN_PANEL_TOKEN --name crm-ai-worker || true
          fi
          # Legacy Google Custom Search secrets are no longer used by the Worker
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY_2 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID_2 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY_3 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID_3 --name crm-ai-worker 2>/dev/null || true
          # Sync Searlo keys
          for var_name in SEARLO_API_KEY SEARLO_API_KEY_2; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Brave Search keys (free tier ~2,000 queries/month)
          for var_name in BRAVE_API_KEY BRAVE_API_KEY_2; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync optional Firecrawl key (fallback scrape for bot-blocked sites)
          if [ -n "$FIRECRAWL_API_KEY" ]; then
            printf '%s' "$FIRECRAWL_API_KEY" | npx wrangler secret put FIRECRAWL_API_KEY
            echo "Synced FIRECRAWL_API_KEY"
          else
            npx wrangler secret delete FIRECRAWL_API_KEY --name crm-ai-worker 2>/dev/null || true
          fi
          # Sync Tavily keys (up to 60; one fixed key per company task)
          # Key #1 accepts both TAVILY_API_KEY and TAVILY_API_KEY_1 naming
          for i in $(seq 1 60); do
            if [ "$i" -eq 1 ]; then var_name=TAVILY_API_KEY; else var_name="TAVILY_API_KEY_$i"; fi
            val="${!var_name:-}"
            if [ -z "$val" ] && [ "$i" -eq 1 ]; then val="${TAVILY_API_KEY_1:-}"; fi
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Exa keys (up to 60)
          # Key #1 accepts both EXA_API_KEY and EXA_API_KEY_1 naming
          for i in $(seq 1 60); do
            if [ "$i" -eq 1 ]; then var_name=EXA_API_KEY; else var_name="EXA_API_KEY_$i"; fi
            val="${!var_name:-}"
            if [ -z "$val" ] && [ "$i" -eq 1 ]; then val="${EXA_API_KEY_1:-}"; fi
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done

      # ADMIN_PANEL_TOKEN is the single secret that stays GitHub-managed, so a
      # rotation can be done from the repo UI without Cloudflare credentials.
      # Runs unconditionally instead of riding the SYNC_SECRETS_FROM_GITHUB
      # gate above: that step deletes every secret absent from GitHub (20-odd
      # `secret delete` lines) and provider keys now live in the /admin/keys
      # D1 pool, so switching it on for one token would drag the whole pool
      # along.
      #
      # Reads the job-level env (line 237), and deliberately never deletes on an
      # empty value: an unset repo secret must not become a missing Worker
      # secret, because /admin 503s without it. Panel edits to this one secret
      # are reverted on the next deploy — GitHub is the source of truth here.
      - name: Sync ADMIN_PANEL_TOKEN from GitHub
        run: |
          if [ -z "$ADMIN_PANEL_TOKEN" ]; then
            echo "GitHub Secret ADMIN_PANEL_TOKEN is empty; leaving the Worker secret untouched"
          else
            printf '%s' "$ADMIN_PANEL_TOKEN" | npx wrangler secret put ADMIN_PANEL_TOKEN
            echo "Synced ADMIN_PANEL_TOKEN from GitHub (workers.dev sessions will need to re-login)"
          fi

      # Post-deploy liveness probe. /health answers 200 ONLY when the D1
      # binding answers a trivial query (src/index.ts), so a green check
      # proves the new deployment is live AND wired to a working database.
      # The GitHub runner can reach workers.dev (some dev boxes cannot),
      # retries absorb the few seconds a fresh deployment needs to
      # propagate, and the body is grepped for "ok":true so a captive 200
      # cannot fake a pass. Override the URL (e.g. a custom domain) via the
      # repo variable WORKER_HEALTH_URL.
      - name: Smoke-test deployed worker (/health)
        env:
          HEALTH_URL: ${{ vars.WORKER_HEALTH_URL || 'https://crm-ai-worker.qdu.workers.dev/health' }}
        run: |
          for i in $(seq 1 6); do
            echo "Attempt $i/6: GET $HEALTH_URL"
            body="$(curl -sS --fail --max-time 30 "$HEALTH_URL")" \
              && echo "$body" | grep -q '"ok": *true' \
              && { echo "Health check passed: $body"; exit 0; } \
              || echo "Attempt $i/6 failed; retrying in 10s"
            sleep 10
          done
          echo "Health check failed after 6 attempts - deployment did not come up healthy"
          exit 1
