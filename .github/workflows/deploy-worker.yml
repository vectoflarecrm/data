name: Deploy CRM AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "crm-ai-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Typecheck and deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GitHub Secret: GEMINI_API_KEY"; exit 1; }
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_D1_DATABASE_ID"; exit 1; }
          if [ "$CLOUDFLARE_D1_DATABASE_ID" = "REPLACE_WITH_D1_DATABASE_ID" ]; then
            echo "CLOUDFLARE_D1_DATABASE_ID is still a placeholder"
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure D1 database ID
        run: |
          D1_ID="$CLOUDFLARE_D1_DATABASE_ID" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler.toml")
          text = path.read_text()
          placeholder = 'database_id = "REPLACE_WITH_D1_DATABASE_ID"'
          if placeholder in text:
              path.write_text(text.replace(placeholder, f'database_id = "{os.environ["D1_ID"]}"'))
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync Gemini Worker Secret
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          if [ -n "$GEMINI_MODEL" ]; then
            printf '%s' "$GEMINI_MODEL" | npx wrangler secret put GEMINI_MODEL
          fi
