      EXA_API_KEY_41: ${{ secrets.EXA_API_KEY_41 }}
      EXA_API_KEY_42: ${{ secrets.EXA_API_KEY_42 }}
      EXA_API_KEY_43: ${{ secrets.EXA_API_KEY_43 }}
      EXA_API_KEY_44: ${{ secrets.EXA_API_KEY_44 }}
