            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync optional RPM limiter overrides (total RPM per provider)
          for var_name in GEMINI_RPM GROQ_RPM CEREBRAS_RPM MISTRAL_RPM DEEPSEEK_RPM ZHIPU_RPM NVIDIA_RPM AMD_RPM OPENROUTER_RPM; do
