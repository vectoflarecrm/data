name: Deploy CRM AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "crm-ai-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Typecheck and deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo "Missing GitHub Secret: OPENROUTER_API_KEY"; exit 1; }
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            echo "Replace database_id in crm-ai-worker/wrangler.toml before deploying"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Sync OpenRouter Worker Secret
        run: |
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
          if [ -n "$OPENROUTER_MODEL" ]; then
            printf '%s' "$OPENROUTER_MODEL" | npx wrangler secret put OPENROUTER_MODEL
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
