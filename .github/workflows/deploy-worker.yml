name: Deploy CRM AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "crm-ai-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-crm-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Typecheck and deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-ai-worker
    env:
