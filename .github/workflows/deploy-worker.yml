name: Deploy CRM AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "crm-ai-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Typecheck and deploy Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GitHub Secret: GEMINI_API_KEY"; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve D1 database ID
        env:
          D1_NAME: crm-ai-db
        run: |
          d1_json="$(npx wrangler d1 list --json)"
          d1_id="$(D1_JSON="$d1_json" node -e '
            const raw = JSON.parse(process.env.D1_JSON);
            const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
            const row = rows.find((item) => item.name === process.env.D1_NAME);
            const id = row && (row.uuid || row.database_id || row.id);
            if (!id) process.exit(1);
            process.stdout.write(id);
          ')"
          test -n "$d1_id" || { echo "D1 database not found: $D1_NAME"; exit 1; }
          D1_ID="$d1_id" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler.toml")
          text = path.read_text()
          placeholder = 'database_id = "REPLACE_WITH_D1_DATABASE_ID"'
          if placeholder in text:
              path.write_text(text.replace(placeholder, f'database_id = "{os.environ["D1_ID"]}"'))
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync Gemini Worker Secret
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          if [ -n "$GEMINI_MODEL" ]; then
            printf '%s' "$GEMINI_MODEL" | npx wrangler secret put GEMINI_MODEL
          fi
