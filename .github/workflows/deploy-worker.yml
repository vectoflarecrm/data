      EXA_API_KEY_59: ${{ secrets.EXA_API_KEY_59 }}
      EXA_API_KEY_60: ${{ secrets.EXA_API_KEY_60 }}
      GMAIL_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GMAIL_SERVICE_ACCOUNT_EMAIL }}
      GMAIL_SERVICE_ACCOUNT_KEY: ${{ secrets.GMAIL_SERVICE_ACCOUNT_KEY }}
      GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
      GMAIL_DAILY_LIMIT: ${{ secrets.GMAIL_DAILY_LIMIT }}
      GMAIL_SEND_DELAY_MS: ${{ secrets.GMAIL_SEND_DELAY_MS }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_PANEL_TOKEN: ${{ secrets.ADMIN_PANEL_TOKEN }}
      # Secret sync from GitHub is now OPT-IN: keys are managed in the admin
      # panel (/admin/keys, D1 dynamic key pool) or via wrangler/CI. Set this
      # repo secret to 'true' only if you want CI to force-sync keys from GitHub.

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "Missing GitHub Secret: GEMINI_API_KEY"; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure D1 database exists
        env:
          D1_NAME: crm-ai-db
        run: |
          set -euo pipefail
          d1_id="${CLOUDFLARE_D1_DATABASE_ID:-}"
          if [ -z "$d1_id" ]; then
            set +e
            d1_json="$(npx wrangler d1 list --json 2>/tmp/d1-list-error)"
            list_status=$?
            set -e
            if [ "$list_status" -eq 0 ]; then
              d1_id="$(D1_JSON="$d1_json" D1_NAME="$D1_NAME" node - <<'NODE'
          const raw = JSON.parse(process.env.D1_JSON || '[]');
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const row = rows.find((item) => item.name === process.env.D1_NAME);
          process.stdout.write((row && (row.uuid || row.database_id || row.databaseId || row.id)) || '');
          NODE
              )"
            fi
          fi
          if [ -z "$d1_id" ]; then
            echo "D1 database $D1_NAME was not found; creating it now"
            create_output="$(npx wrangler d1 create "$D1_NAME" --binding DB 2>/tmp/d1-create-error)" || {
              echo "Unable to create D1 database $D1_NAME"
              sed -n '1,20p' /tmp/d1-create-error
              exit 1
            }
            d1_id="$(printf '%s\n' "$create_output" | sed -nE 's/.*database_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -1)"
          fi
          if ! printf '%s' "$d1_id" | grep -Eq '^[0-9a-fA-F-]{16,}$'; then
            echo "Could not resolve a valid D1 database ID for $D1_NAME"
            exit 1
          fi
          echo "D1_ID=$d1_id" >> "$GITHUB_ENV"
          echo "::add-mask::$d1_id"

      - name: Configure D1 database ID
        run: |
          D1_ID="$D1_ID" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("wrangler.toml")
          text = path.read_text()
          placeholder = 'database_id = "REPLACE_WITH_D1_DATABASE_ID"'
          # Stage 5: the repo keeps only the placeholder. Failing hard here
          # prevents a real database id from quietly re-entering the repo.
          if placeholder not in text:
              raise SystemExit('wrangler.toml is missing database_id = "REPLACE_WITH_D1_DATABASE_ID" - real D1 ids must not be committed (security-v2 stage 5)')
          path.write_text(text.replace(placeholder, f'database_id = "{os.environ["D1_ID"]}"'))
          PY

      - name: Initialize remote D1 schema
        run: npx wrangler d1 execute crm-ai-db --remote --file=./schema.sql

      - name: Verify remote D1 schema
        run: |
          schema_output="$(npx wrangler d1 execute crm-ai-db --remote --command='SELECT name FROM sqlite_master WHERE type = "table" AND name = "customers";')"
          printf '%s\n' "$schema_output"
          printf '%s' "$schema_output" | grep -q 'customers' || {
            echo "Remote D1 schema check failed: customers table is missing"
            exit 1
          }

      - name: Migrate customers profile columns
        # ADD COLUMN is not idempotent in D1 files (a duplicate column fails
        # the whole batch), so migrations run per-statement and ignore the
        # "already exists" error — every later run becomes a no-op.
        run: |
          for col in company_profile TEXT outreach_context TEXT lead_score INTEGER buying_signals TEXT source_import_id TEXT; do
            set -- $col
            npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE customers ADD COLUMN $1 $2" 2>&1 | grep -q 'duplicate column name' && echo "$1 already exists" || true
          done
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('customers') WHERE name IN ('company_profile','outreach_context','lead_score','buying_signals','source_import_id')")"
          echo "$info" | grep -q '"n": 5' || { echo 'Migration failed: enrichment columns missing'; exit 1; }

      - name: Migrate api_configs credential columns
        # key_hint / key_fingerprint support encrypted key storage. They live
        # in schema.sql's CREATE TABLE too, but an existing database needs the
        # ALTER, and D1 fails a whole schema file on a duplicate ALTER — hence
        # per-statement with duplicate-column tolerance, same as above.
        run: |
          for col in key_hint TEXT key_fingerprint TEXT; do
            set -- $col
            npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE api_configs ADD COLUMN $1 $2" 2>&1 | grep -q 'duplicate column name' && echo "$1 already exists" || true
          done
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('api_configs') WHERE name IN ('key_hint','key_fingerprint')")"
          echo "$info" | grep -q '"n": 2' || { echo 'Migration failed: api_configs credential columns missing'; exit 1; }

      - name: Migrate outreach_emails send-state columns (Security V2 Stage 10)
        # Gmail sending state machine (spec §11): idempotency key, attempt
        # counter, lock fields, last_error, gmail_message_id. Same per-statement
        # ALTER pattern as above; the indexes are IF NOT EXISTS so schema.sql
        # and this step agree on both fresh and existing databases.
        run: |
          for col in idempotency_key:TEXT send_attempts:"INTEGER NOT NULL DEFAULT 0" locked_at:TEXT locked_by:TEXT last_error:TEXT gmail_message_id:TEXT; do
            name="${col%%:*}"
            def="${col#*:}"
            npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE outreach_emails ADD COLUMN $name $def" 2>&1 | grep -q 'duplicate column name' && echo "$name already exists" || true
          done
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_outreach_idempotency ON outreach_emails(idempotency_key) WHERE idempotency_key IS NOT NULL" || true
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE INDEX IF NOT EXISTS idx_outreach_send_lock ON outreach_emails(status, locked_at)" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('outreach_emails') WHERE name IN ('idempotency_key','send_attempts','locked_at','locked_by','last_error','gmail_message_id')")"
          echo "$info" | grep -q '"n": 6' || { echo 'Migration failed: outreach_emails send-state columns missing'; exit 1; }

      - name: Migrate gmail_send_log sender column (Security V2 Stage 23)
        # sender_client_email (per-account daily quota counting, gmail-quota.ts)
        # lived only in migrations/0003 — a fresh schema.sql install lacked it
        # and reserveQuota failed closed. schema.sql's CREATE now has it; this
        # per-statement ALTER with duplicate-column tolerance self-heals any
        # database created from the old schema.sql, same pattern as above.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE gmail_send_log ADD COLUMN sender_client_email TEXT" 2>&1 | grep -q 'duplicate column name' && echo "sender_client_email already exists" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('gmail_send_log') WHERE name = 'sender_client_email'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: gmail_send_log sender column missing'; exit 1; }

      - name: Migrate research runs + evidence provenance (Security V2 Stage 14)
        # Evidence V2 (spec §15): research_runs (new table, created by
        # schema.sql via IF NOT EXISTS — the CREATE here is belt-and-suspenders)
        # plus append-only evidence columns. Existing rows become is_current = 1
        # via the ALTER's NOT NULL DEFAULT — they were the current facts at
        # migration time. Same per-statement ALTER pattern as above.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE TABLE IF NOT EXISTS research_runs (id TEXT PRIMARY KEY, customer_id TEXT NOT NULL, status TEXT NOT NULL, started_at TEXT NOT NULL, completed_at TEXT, parser_version TEXT, model_name TEXT, model_version TEXT, error TEXT)" || true
          for col in research_run_id:TEXT source_id:TEXT source_hash:TEXT content_hash:TEXT parser_version:TEXT model_name:TEXT model_version:TEXT retrieved_at:TEXT "is_current:INTEGER NOT NULL DEFAULT 1" valid_from:TEXT valid_until:TEXT; do
            name="${col%%:*}"
            def="${col#*:}"
            npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE evidence ADD COLUMN $name $def" 2>&1 | grep -q 'duplicate column name' && echo "$name already exists" || true
          done
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('evidence') WHERE name IN ('research_run_id','source_id','source_hash','content_hash','parser_version','model_name','model_version','retrieved_at','is_current','valid_from','valid_until')")"
          echo "$info" | grep -q '"n": 11' || { echo 'Migration failed: evidence provenance columns missing'; exit 1; }
          info2="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'table' AND name = 'research_runs'")"
          echo "$info2" | grep -q '"n": 1' || { echo 'Migration failed: research_runs table missing'; exit 1; }

      - name: Migrate customers completeness column (Security V2 Stage 15)
        # Spec §16: data_completeness_score is a quality axis SEPARATE from
        # lead_score (fit vs. how well we know the record). Same per-statement
        # ALTER pattern; no backfill — NULL means "not yet scored".
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE customers ADD COLUMN data_completeness_score INTEGER" 2>&1 | grep -q 'duplicate column name' && echo "data_completeness_score already exists" || true
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM pragma_table_info('customers') WHERE name = 'data_completeness_score'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: data_completeness_score missing'; exit 1; }

      - name: Migrate contacts + integrity indexes (Security V2 Stage 17)
        # Spec §18: the contacts table was read/written by the code but only
        # ever created manually in production — the CREATE here (plus
        # schema.sql) fixes fresh installs and pins the production shape.
        # The §18.1 UNIQUE indexes are created with || true tolerance (Stage
        # 10 idempotency-index precedent): if a live table already holds
        # duplicates the creation is skipped with a warning instead of
        # blocking the deploy — the verification query below reports which
        # indexes exist so a skipped one is visible in the CI log.
        run: |
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE TABLE IF NOT EXISTS contacts (id INTEGER PRIMARY KEY, contact_id TEXT NOT NULL, company_id TEXT NOT NULL, seq INTEGER NOT NULL, first_name TEXT, last_name TEXT, full_name TEXT, title TEXT, department TEXT, email TEXT, cellphone TEXT, tel TEXT, whatsapp TEXT, linkedin_url TEXT, social_accounts TEXT)" || true
          npx wrangler d1 execute crm-ai-db --remote --command "ALTER TABLE customers ADD COLUMN display_id TEXT" 2>&1 | grep -q 'duplicate column name' && echo "display_id already exists" || true
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_customers_domain ON customers(domain) WHERE domain != ''" || echo "WARNING: idx_customers_domain skipped (duplicate domains exist — clean them and re-run)"
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_api_configs_fingerprint ON api_configs(provider, key_fingerprint) WHERE key_fingerprint IS NOT NULL" || echo "WARNING: idx_api_configs_fingerprint skipped (duplicate fingerprints exist — clean them and re-run)"
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_contacts_contact_id ON contacts(contact_id)" || echo "WARNING: idx_contacts_contact_id skipped (duplicate contact_id values exist)"
          npx wrangler d1 execute crm-ai-db --remote --command "CREATE UNIQUE INDEX IF NOT EXISTS idx_contacts_seq ON contacts(company_id, seq)" || echo "WARNING: idx_contacts_seq skipped (duplicate (company_id, seq) pairs exist)"
          info="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'table' AND name = 'contacts'")"
          echo "$info" | grep -q '"n": 1' || { echo 'Migration failed: contacts table missing'; exit 1; }
          indexes="$(npx wrangler d1 execute crm-ai-db --remote --json --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'index' AND name IN ('idx_customers_domain','idx_api_configs_fingerprint','idx_contacts_contact_id','idx_contacts_seq','idx_contacts_company','idx_research_runs_customer')")"
          echo "integrity indexes present: $indexes"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync Worker secrets
        if: env.SYNC_SECRETS_FROM_GITHUB == 'true'
        env:
          SYNC_SECRETS_FROM_GITHUB: ${{ secrets.SYNC_SECRETS_FROM_GITHUB }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          # Sync extra Gemini keys (up to 40; one fixed key per company task)
          for i in $(seq 2 40); do
            var_name="GEMINI_API_KEY_$i"
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          if [ -n "$GEMINI_MODEL" ]; then
            printf '%s' "$GEMINI_MODEL" | npx wrangler secret put GEMINI_MODEL
          fi
          # Sync Groq keys
          for var_name in GROQ_API_KEY GROQ_API_KEY_2 GROQ_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Cerebras keys
          for var_name in CEREBRAS_API_KEY CEREBRAS_API_KEY_2 CEREBRAS_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Zhipu keys
          for var_name in ZHIPU_API_KEY ZHIPU_API_KEY_2 ZHIPU_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync NVIDIA NIM keys
          for var_name in NVIDIA_API_KEY NVIDIA_API_KEY_2 NVIDIA_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync AMD Radeon Cloud keys
          for var_name in AMD_API_KEY AMD_API_KEY_2 AMD_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Mistral keys
          for var_name in MISTRAL_API_KEY MISTRAL_API_KEY_2 MISTRAL_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync DeepSeek keys
          for var_name in DEEPSEEK_API_KEY DEEPSEEK_API_KEY_2 DEEPSEEK_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync OpenRouter keys
          for var_name in OPENROUTER_API_KEY OPENROUTER_API_KEY_2 OPENROUTER_API_KEY_3 OPENROUTER_MODEL; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync optional RPM limiter overrides (total RPM per provider)
          for var_name in GEMINI_RPM GROQ_RPM CEREBRAS_RPM MISTRAL_RPM DEEPSEEK_RPM ZHIPU_RPM NVIDIA_RPM AMD_RPM OPENROUTER_RPM; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Gmail (Google Workspace service account) sending secrets
          for var_name in GMAIL_SERVICE_ACCOUNT_EMAIL GMAIL_SENDER_EMAIL GMAIL_DAILY_LIMIT GMAIL_SEND_DELAY_MS; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Private key contains newlines: sync via stdin file
          if [ -n "$GMAIL_SERVICE_ACCOUNT_KEY" ]; then
            printf '%s' "$GMAIL_SERVICE_ACCOUNT_KEY" | npx wrangler secret put GMAIL_SERVICE_ACCOUNT_KEY
            echo "Synced GMAIL_SERVICE_ACCOUNT_KEY"
          else
            npx wrangler secret delete GMAIL_SERVICE_ACCOUNT_KEY --name crm-ai-worker 2>/dev/null || true
          fi
          if [ -n "$ADMIN_PANEL_TOKEN" ]; then
            printf '%s' "$ADMIN_PANEL_TOKEN" | npx wrangler secret put ADMIN_PANEL_TOKEN
          else
            echo "ADMIN_PANEL_TOKEN is not configured; /admin remains disabled"
            npx wrangler secret delete ADMIN_PANEL_TOKEN --name crm-ai-worker || true
          fi
          # Legacy Google Custom Search secrets are no longer used by the Worker
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY_2 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID_2 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_API_KEY_3 --name crm-ai-worker 2>/dev/null || true
          npx wrangler secret delete GOOGLE_SEARCH_ENGINE_ID_3 --name crm-ai-worker 2>/dev/null || true
          # Sync Searlo keys
          for var_name in SEARLO_API_KEY SEARLO_API_KEY_2; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Brave Search keys (free tier ~2,000 queries/month)
          for var_name in BRAVE_API_KEY BRAVE_API_KEY_2; do
            val="${!var_name:-}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync optional Firecrawl key (fallback scrape for bot-blocked sites)
          if [ -n "$FIRECRAWL_API_KEY" ]; then
            printf '%s' "$FIRECRAWL_API_KEY" | npx wrangler secret put FIRECRAWL_API_KEY
            echo "Synced FIRECRAWL_API_KEY"
          else
            npx wrangler secret delete FIRECRAWL_API_KEY --name crm-ai-worker 2>/dev/null || true
          fi
          # Sync Tavily keys (up to 60; one fixed key per company task)
          # Key #1 accepts both TAVILY_API_KEY and TAVILY_API_KEY_1 naming
          for i in $(seq 1 60); do
            if [ "$i" -eq 1 ]; then var_name=TAVILY_API_KEY; else var_name="TAVILY_API_KEY_$i"; fi
            val="${!var_name:-}"
            if [ -z "$val" ] && [ "$i" -eq 1 ]; then val="${TAVILY_API_KEY_1:-}"; fi
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done
          # Sync Exa keys (up to 60)
          # Key #1 accepts both EXA_API_KEY and EXA_API_KEY_1 naming
          for i in $(seq 1 60); do
            if [ "$i" -eq 1 ]; then var_name=EXA_API_KEY; else var_name="EXA_API_KEY_$i"; fi
            val="${!var_name:-}"
            if [ -z "$val" ] && [ "$i" -eq 1 ]; then val="${EXA_API_KEY_1:-}"; fi
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$var_name"
              echo "Synced $var_name"
            else
              npx wrangler secret delete "$var_name" --name crm-ai-worker 2>/dev/null || true
            fi
          done

      # ADMIN_PANEL_TOKEN is the single secret that stays GitHub-managed, so a
      # rotation can be done from the repo UI without Cloudflare credentials.
      # Runs unconditionally instead of riding the SYNC_SECRETS_FROM_GITHUB
      # gate above: that step deletes every secret absent from GitHub (20-odd
      # `secret delete` lines) and provider keys now live in the /admin/keys
      # D1 pool, so switching it on for one token would drag the whole pool
      # along.
      #
      # Reads the job-level env (line 237), and deliberately never deletes on an
      # empty value: an unset repo secret must not become a missing Worker
      # secret, because /admin 503s without it. Panel edits to this one secret
      # are reverted on the next deploy — GitHub is the source of truth here.
      - name: Sync ADMIN_PANEL_TOKEN from GitHub
        run: |
          if [ -z "$ADMIN_PANEL_TOKEN" ]; then
            echo "GitHub Secret ADMIN_PANEL_TOKEN is empty; leaving the Worker secret untouched"
          else
            printf '%s' "$ADMIN_PANEL_TOKEN" | npx wrangler secret put ADMIN_PANEL_TOKEN
            echo "Synced ADMIN_PANEL_TOKEN from GitHub (workers.dev sessions will need to re-login)"
          fi
